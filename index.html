<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1024">
<title>婚禮照片牆 · 投影端</title>
<style>
  /* ===== 投影端專用樣式 ===== */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #120a1c;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: #fff;
    cursor: none;
  }

  /* 背景：柔和漸層 + 緩慢流動，避免純黑死板 */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255, 182, 193, .22), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(180, 160, 255, .20), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(255, 220, 180, .10), transparent 70%),
      linear-gradient(160deg, #1a1024 0%, #241432 45%, #150d1f 100%);
    animation: bgShift 24s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0%   { filter: hue-rotate(0deg) saturate(1); }
    100% { filter: hue-rotate(18deg) saturate(1.15); }
  }

  /* 細緻的星點 */
  #stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .5; }

  /* ===== 主舞台 ===== */
  #stage {
    position: relative; z-index: 2;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 4vw;
    padding: 4vh 5vw;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity .9s ease;
    pointer-events: none;
  }
  .slide.active { opacity: 1; }

  /* 照片卡 */
  .photo-wrap {
    position: relative;
    flex: 0 1 auto;
    max-width: 62vw;
    max-height: 84vh;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.10),
      0 0 60px rgba(255, 190, 210, .18);
    background: #241432;
    transform: scale(.94) translateY(18px);
    transition: transform 1.1s cubic-bezier(.16,.84,.34,1);
  }
  .slide.active .photo-wrap { transform: scale(1) translateY(0); }

  .photo-wrap img {
    display: block;
    max-width: 62vw;
    max-height: 84vh;
    width: auto; height: auto;
    object-fit: contain;
  }

  /* 照片上的柔光 */
  .photo-wrap::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 30%, transparent 70%, rgba(0,0,0,.18));
    pointer-events: none;
  }

  /* 祝福文字區 */
  .blessing {
    flex: 0 1 34vw;
    max-width: 34vw;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 2.2vh;
    opacity: 0;
    transform: translateX(28px);
    transition: opacity .9s ease .35s, transform .9s cubic-bezier(.16,.84,.34,1) .35s;
  }
  .slide.active .blessing { opacity: 1; transform: translateX(0); }

  .quote-mark {
    font-size: clamp(48px, 6vw, 96px);
    line-height: .6;
    color: rgba(255, 200, 220, .45);
    font-family: Georgia, serif;
  }

  .blessing-text {
    font-size: clamp(22px, 2.5vw, 46px);
    line-height: 1.55;
    font-weight: 500;
    letter-spacing: .02em;
    text-shadow: 0 4px 24px rgba(0,0,0,.5);
    word-break: break-word;
  }

  .blessing-signer {
    font-size: clamp(16px, 1.5vw, 28px);
    color: rgba(255, 220, 235, .82);
    letter-spacing: .08em;
    display: flex; align-items: center; gap: .6em;
  }
  .blessing-signer::before {
    content: ''; display: block;
    width: 2.4em; height: 1px;
    background: linear-gradient(90deg, rgba(255,200,220,.7), transparent);
  }

  /* 直式照片時，文字改到下方 */
  .slide.portrait { flex-direction: column; gap: 2.4vh; }
  .slide.portrait .photo-wrap { max-width: 80vw; max-height: 62vh; }
  .slide.portrait .photo-wrap img { max-width: 80vw; max-height: 62vh; }
  .slide.portrait .blessing {
    flex: 0 0 auto; max-width: 80vw; text-align: center;
    align-items: center; transform: translateY(20px);
  }
  .slide.portrait.active .blessing { transform: translateY(0); }
  .slide.portrait .blessing-signer::before { display: none; }
  .slide.portrait .quote-mark { display: none; }

  /* ===== 新照片進場特效 ===== */
  .slide.fresh .photo-wrap {
    animation: popIn 1.2s cubic-bezier(.16,.84,.34,1);
  }
  @keyframes popIn {
    0%   { transform: scale(.82) rotate(-1.5deg); filter: brightness(1.5) blur(6px); }
    60%  { transform: scale(1.03) rotate(.4deg); filter: brightness(1.05) blur(0); }
    100% { transform: scale(1) rotate(0); filter: brightness(1) blur(0); }
  }
  .slide.fresh::before {
    content: 'NEW ✨';
    position: absolute; top: 5vh; right: 6vw;
    font-size: clamp(14px, 1.2vw, 22px);
    letter-spacing: .3em;
    padding: .5em 1.1em;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff9ec4, #ffd6a5);
    color: #3a1024; font-weight: 700;
    animation: badgeIn .8s ease, badgeOut .6s ease 3.4s forwards;
    z-index: 5;
  }
  @keyframes badgeIn { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes badgeOut { to { opacity: 0; transform: translateY(-10px); } }

  /* ===== 待機畫面 ===== */
  #idle {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3vh; text-align: center;
    transition: opacity .8s ease;
  }
  #idle.hidden { opacity: 0; pointer-events: none; }

  .idle-title {
    font-size: clamp(34px, 5vw, 88px);
    font-weight: 300;
    letter-spacing: .18em;
    background: linear-gradient(120deg, #fff, #ffd6e8 40%, #d9c8ff 70%, #fff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
    background-size: 220% auto;
  }
  @keyframes shimmer { to { background-position: 220% center; } }

  .idle-sub {
    font-size: clamp(15px, 1.5vw, 26px);
    color: rgba(255,255,255,.62);
    letter-spacing: .22em;
  }

  .idle-hint {
    margin-top: 4vh;
    font-size: clamp(13px, 1.1vw, 19px);
    color: rgba(255,255,255,.42);
    letter-spacing: .1em;
    line-height: 2;
  }
  .idle-hint b { color: rgba(255, 200, 220, .9); font-weight: 600; }

  /* 心跳光點 */
  .pulse {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff9ec4;
    box-shadow: 0 0 0 0 rgba(255,158,196,.7);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,158,196,.6); }
    70%  { box-shadow: 0 0 0 22px rgba(255,158,196,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,158,196,0); }
  }

  /* ===== 暫停遮罩 ===== */
  #paused {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 2vh;
    background: rgba(10, 6, 16, .82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #paused.show { display: flex; }
  .paused-icon {
    width: 96px; height: 96px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
  }
  .paused-icon span {
    display: block; width: 10px; height: 34px;
    background: rgba(255,255,255,.85); border-radius: 3px;
  }
  .paused-text {
    font-size: clamp(18px, 1.8vw, 30px);
    letter-spacing: .3em; color: rgba(255,255,255,.8);
  }
  .paused-sub { font-size: clamp(12px, 1vw, 16px); color: rgba(255,255,255,.4); letter-spacing: .1em; }

  /* ===== 角落狀態列 ===== */
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.4vh 2.4vw;
    font-size: clamp(11px, .85vw, 15px);
    color: rgba(255,255,255,.34);
    letter-spacing: .12em;
    pointer-events: none;
    transition: opacity .6s ease;
  }
  #hud.dim { opacity: 0; }
  .hud-left, .hud-right { display: flex; align-items: center; gap: 1.2em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7a8; }
  .dot.offline { background: #ff8a8a; }
  .dot.warn { background: #ffd166; }

  /* 跑馬燈 */
  #ticker {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    padding: .9vh 0;
    background: linear-gradient(90deg, rgba(255,158,196,.16), rgba(217,200,255,.16));
    border-top: 1px solid rgba(255,255,255,.08);
    overflow: hidden; white-space: nowrap;
    display: none;
  }
  #ticker.show { display: block; }
  #ticker span {
    display: inline-block; padding-left: 100%;
    font-size: clamp(13px, 1.1vw, 20px);
    color: rgba(255,255,255,.85);
    letter-spacing: .1em;
    animation: tickerMove 26s linear infinite;
  }
  @keyframes tickerMove { to { transform: translateX(-100%); } }

  /* 進度條 */
  #progress {
    position: fixed; left: 0; bottom: 0; height: 3px; z-index: 12;
    background: linear-gradient(90deg, #ff9ec4, #ffd6a5, #d9c8ff);
    width: 0%;
    transition: width .2s linear;
    box-shadow: 0 0 12px rgba(255,158,196,.6);
  }

  /* 錯誤提示 */
  #toast {
    position: fixed; top: 3vh; left: 50%; transform: translateX(-50%) translateY(-20px);
    z-index: 30; padding: .8em 1.6em; border-radius: 999px;
    background: rgba(255, 120, 120, .16);
    border: 1px solid rgba(255, 120, 120, .4);
    color: #ffd9d9; font-size: clamp(12px, 1vw, 16px);
    letter-spacing: .06em;
    opacity: 0; transition: all .4s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 小螢幕（休息室手機） */
  @media (max-width: 820px) {
    .slide { flex-direction: column; gap: 2vh; padding: 3vh 4vw; }
    .photo-wrap, .photo-wrap img { max-width: 92vw; max-height: 58vh; }
    .blessing { max-width: 92vw; text-align: center; align-items: center; }
    .blessing-signer::before { display: none; }
    .quote-mark { display: none; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="stars"></canvas>

<div id="stage">
  <!-- 待機畫面 -->
  <div id="idle">
    <div class="pulse"></div>
    <div class="idle-title" id="idleTitle">新郎 &amp; 新娘</div>
    <div class="idle-sub" id="idleDate">2027.05.15</div>
    <div class="idle-hint">
      用 LINE 掃描桌上的 QR Code<br>
      把照片與祝福送上大螢幕 <b>✨</b>
    </div>
  </div>
</div>

<!-- 暫停遮罩 -->
<div id="paused">
  <div class="paused-icon"><span></span><span></span></div>
  <div class="paused-text">暫停播放</div>
  <div class="paused-sub">主持人恢復播放後會自動繼續</div>
</div>

<!-- 跑馬燈 -->
<div id="ticker"><span id="tickerText"></span></div>

<!-- 進度條 -->
<div id="progress"></div>

<!-- 狀態列 -->
<div id="hud">
  <div class="hud-left">
    <span class="dot" id="netDot"></span>
    <span id="netText">連線中…</span>
  </div>
  <div class="hud-right">
    <span id="countText">0 張照片</span>
    <span id="clockText"></span>
  </div>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="assets/api.js"></script>
<script>
(function () {
  'use strict';

  var cfg = window.APP_CONFIG || {};
  var API = window.WeddingAPI;

  var POLL_MS = Math.max(10, Number(cfg.POLL_SECONDS) || 10) * 1000;
  var SLIDE_MS = Math.max(3, Number(cfg.SLIDE_SECONDS) || 8) * 1000;
  var CACHE_KEY = 'wedding_wall_cache_v1';

  /* ---------- 狀態 ---------- */
  var state = {
    photos: [],          // 目前要播的清單
    index: 0,
    playing: true,
    version: '',
    lastSeq: 0,
    online: true,
    failCount: 0,
    slideTimer: null,
    pollTimer: null,
    slideStart: 0,
    freshIds: {}         // 剛插播的照片 id，用來加 NEW 特效
  };

  var el = {
    stage: document.getElementById('stage'),
    idle: document.getElementById('idle'),
    idleTitle: document.getElementById('idleTitle'),
    idleDate: document.getElementById('idleDate'),
    paused: document.getElementById('paused'),
    hud: document.getElementById('hud'),
    netDot: document.getElementById('netDot'),
    netText: document.getElementById('netText'),
    countText: document.getElementById('countText'),
    clockText: document.getElementById('clockText'),
    progress: document.getElementById('progress'),
    ticker: document.getElementById('ticker'),
    tickerText: document.getElementById('tickerText'),
    toast: document.getElementById('toast')
  };

  /* ---------- 初始化文字 ---------- */
  if (cfg.COUPLE_NAMES) el.idleTitle.textContent = cfg.COUPLE_NAMES;
  if (cfg.WEDDING_DATE_TEXT) el.idleDate.textContent = cfg.WEDDING_DATE_TEXT;

  /* ---------- 時鐘 ---------- */
  function tickClock() {
    var d = new Date();
    el.clockText.textContent =
      ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  tickClock();
  setInterval(tickClock, 15000);

  /* ---------- 星點背景 ---------- */
  (function drawStars() {
    var c = document.getElementById('stars');
    var ctx = c.getContext('2d');
    var stars = [];

    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      stars = [];
      var n = Math.min(140, Math.floor(c.width * c.height / 14000));
      for (var i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * c.width,
          y: Math.random() * c.height,
          r: Math.random() * 1.4 + .3,
          a: Math.random() * .6 + .15,
          s: Math.random() * .02 + .004
        });
      }
    }

    function loop() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        st.a += st.s;
        if (st.a > .85 || st.a < .12) st.s *= -1;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 235, 245, ' + st.a.toFixed(2) + ')';
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }

    resize();
    window.addEventListener('resize', resize);
    loop();
  })();

  /* ---------- 提示訊息 ---------- */
  var toastTimer = null;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 4000);
  }

  /* ---------- 連線狀態 ---------- */
  function setOnline(ok, text) {
    state.online = ok;
    el.netDot.className = 'dot' + (ok ? '' : ' offline');
    el.netText.textContent = text || (ok ? '已連線' : '離線（播放快取）');
  }

  /* ---------- 本機快取 ---------- */
  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        photos: state.photos,
        version: state.version,
        lastSeq: state.lastSeq,
        savedAt: Date.now()
      }));
    } catch (e) { /* 容量滿了就放棄，不影響播放 */ }
  }

  function loadCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!data || !data.photos || !data.photos.length) return false;
      state.photos = data.photos;
      state.version = data.version || '';
      state.lastSeq = data.lastSeq || 0;
      return true;
    } catch (e) { return false; }
  }

  /* ---------- 建立投影片 DOM ---------- */
  function buildSlide(photo, isFresh) {
    var slide = document.createElement('div');
    slide.className = 'slide' + (isFresh ? ' fresh' : '');
    slide.dataset.id = photo.id;

    var wrap = document.createElement('div');
    wrap.className = 'photo-wrap';

    var img = document.createElement('img');
    img.alt = '賓客照片';
    img.loading = 'eager';
    img.decoding = 'async';
    // 主圖失敗時自動換 GitHub 備援
    img.onerror = function () {
      if (photo.fallbackUrl && img.src !== photo.fallbackUrl) {
        img.src = photo.fallbackUrl;
      }
    };
    img.src = photo.url || photo.fallbackUrl || '';
    wrap.appendChild(img);

    var bless = document.createElement('div');
    bless.className = 'blessing';

    var q = document.createElement('div');
    q.className = 'quote-mark';
    q.textContent = '“';
    bless.appendChild(q);

    var txt = document.createElement('div');
    txt.className = 'blessing-text';
    txt.textContent = photo.message || '';
    bless.appendChild(txt);

    if (photo.signer) {
      var sg = document.createElement('div');
      sg.className = 'blessing-signer';
      sg.textContent = photo.signer;
      bless.appendChild(sg);
    }

    slide.appendChild(wrap);
    slide.appendChild(bless);

    // 直式照片 → 文字改到下方
    img.addEventListener('load', function () {
      if (img.naturalHeight > img.naturalWidth * 1.05) {
        slide.classList.add('portrait');
      }
    });

    return slide;
  }

  /* ---------- 重繪整個舞台 ---------- */
  function renderAll(keepIndex) {
    var oldIndex = keepIndex ? state.index : 0;

    // 清掉舊的投影片（保留 idle）
    Array.prototype.slice.call(el.stage.querySelectorAll('.slide')).forEach(function (n) {
      n.remove();
    });

    if (!state.photos.length) {
      el.idle.classList.remove('hidden');
      el.countText.textContent = '0 張照片';
      return;
    }

    el.idle.classList.add('hidden');

    state.photos.forEach(function (p) {
      el.stage.appendChild(buildSlide(p, !!state.freshIds[p.id]));
    });

    state.index = Math.min(oldIndex, state.photos.length - 1);
    showSlide(state.index, false);
    el.countText.textContent = state.photos.length + ' 張照片';
  }

  /* ---------- 顯示某張 ---------- */
  function showSlide(i, animate) {
    var slides = el.stage.querySelectorAll('.slide');
    if (!slides.length) return;

    if (i < 0) i = slides.length - 1;
    if (i >= slides.length) i = 0;
    state.index = i;

    for (var k = 0; k < slides.length; k++) {
      slides[k].classList.toggle('active', k === i);
    }

    // 移除 NEW 標記（播過一次就不再是新照片）
    var cur = slides[i];
    if (cur) {
      var id = cur.dataset.id;
      if (state.freshIds[id]) {
        setTimeout(function () { cur.classList.remove('fresh'); }, 4200);
        delete state.freshIds[id];
      }
    }

    state.slideStart = Date.now();
    restartSlideTimer();
  }

  /* ---------- 自動輪播 ---------- */
  function restartSlideTimer() {
    clearTimeout(state.slideTimer);
    if (!state.playing) return;
    if (state.photos.length <= 1) {
      el.progress.style.width = '0%';
      return;
    }
    state.slideTimer = setTimeout(function () {
      showSlide(state.index + 1, true);
    }, SLIDE_MS);
  }

  /* ---------- 進度條 ---------- */
  setInterval(function () {
    if (!state.playing || state.photos.length <= 1) {
      el.progress.style.width = '0%';
      return;
    }
    var pct = Math.min(100, (Date.now() - state.slideStart) / SLIDE_MS * 100);
    el.progress.style.width = pct + '%';
  }, 200);

  /* ---------- 暫停 / 播放 ---------- */
  function applyPlayback(playing) {
    var changed = state.playing !== playing;
    state.playing = playing;

    if (playing) {
      el.paused.classList.remove('show');
      if (changed) restartSlideTimer();
    } else {
      el.paused.classList.add('show');
      clearTimeout(state.slideTimer);
      el.progress.style.width = '0%';
    }
  }

  /* ---------- 跑馬燈 ---------- */
  function applyAnnouncement(text) {
    if (text && String(text).trim()) {
      el.tickerText.textContent = String(text);
      el.ticker.classList.add('show');
      el.hud.style.bottom = '4.2vh';
    } else {
      el.ticker.classList.remove('show');
      el.hud.style.bottom = '0';
    }
  }

  /* ---------- 輪詢 ---------- */
  function poll() {
    clearTimeout(state.pollTimer);

    API.getPhotos(cfg.TOKEN_PROJECTOR, {
      since: 0,
      version: state.version
    }).then(function (res) {
      state.failCount = 0;
      setOnline(true, '已連線');

      // 播放狀態同步（即使照片沒變也要同步）
      applyPlayback(res.playback !== 'paused');
      applyAnnouncement(res.announcement);

      if (res.unchanged) {
        scheduleNextPoll();
        return;
      }

      var incoming = res.photos || [];
      var prevIds = {};
      state.photos.forEach(function (p) { prevIds[p.id] = true; });

      // 找出新照片
      var newOnes = incoming.filter(function (p) { return !prevIds[p.id]; });
      newOnes.forEach(function (p) { state.freshIds[p.id] = true; });

      var hadPhotos = state.photos.length > 0;
      state.photos = incoming;
      state.version = res.version || '';

      if (!incoming.length) {
        renderAll(false);
        saveCache();
        scheduleNextPoll();
        return;
      }

      if (!hadPhotos) {
        // 第一次載入：從第一張開始
        renderAll(false);
      } else if (newOnes.length) {
        // 有新照片：只「追加」新的 DOM，不重建全部（600 張時才不會卡）
        appendNewSlides(newOnes);
        insertNewPhotos(newOnes);
      } else {
        // 只是有照片被移除（退回/刪除）：重建但保持當前位置
        renderAll(true);
      }

      saveCache();
      scheduleNextPoll();
    }).catch(function (err) {
      state.failCount++;
      setOnline(false, '離線（播放快取）');

      if (state.failCount === 1) {
        toast('後端連線中斷，先播放本機快取');
      }

      // 第一次失敗且沒有資料 → 試著讀快取
      if (!state.photos.length) {
        if (loadCache()) {
          renderAll(false);
          toast('已載入本機快取照片');
        }
      }

      // 指數退避，最多 60 秒
      var wait = Math.min(60000, POLL_MS * Math.pow(1.6, Math.min(state.failCount, 5)));
      state.pollTimer = setTimeout(poll, wait);
    });
  }

  function scheduleNextPoll() {
    clearTimeout(state.pollTimer);
    state.pollTimer = setTimeout(poll, POLL_MS);
  }

  /**
   * 只把「新照片」追加到舞台尾端，不重建已有的投影片。
   * 這樣 600 張照片時，每來一張新照片只多一個 DOM 節點，不會卡頓。
   */
  function appendNewSlides(newOnes) {
    if (!newOnes.length) return;
    el.idle.classList.add('hidden');

    newOnes.forEach(function (p) {
      el.stage.appendChild(buildSlide(p, true));
    });

    el.countText.textContent = state.photos.length + ' 張照片';
  }

  /**
   * 新照片插播：
   * 把新照片插到「目前這張之後」，播完一輪就自然融入。
   * 這裡的做法是直接跳到第一張新照片，讓賓客馬上看到自己的照片。
   */
  function insertNewPhotos(newOnes) {
    if (!newOnes.length) return;

    // 找到第一張新照片在清單中的位置
    var firstNewId = newOnes[0].id;
    var targetIndex = -1;
    for (var i = 0; i < state.photos.length; i++) {
      if (state.photos[i].id === firstNewId) { targetIndex = i; break; }
    }
    if (targetIndex < 0) return;

    // 若正在播放，直接切到新照片（賓客最想看到自己的照片上牆）
    if (state.playing) {
      showSlide(targetIndex, true);
    }
  }

  /* ---------- 鍵盤快捷（測試用） ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') showSlide(state.index + 1, true);
    if (e.key === 'ArrowLeft') showSlide(state.index - 1, true);
    if (e.key === ' ') {
      e.preventDefault();
      applyPlayback(!state.playing);
    }
    if (e.key === 'f') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  /* ---------- 點擊進入全螢幕（投影機第一次操作） ---------- */
  document.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  });

  /* ---------- 網路狀態 ---------- */
  window.addEventListener('online', function () {
    setOnline(true, '已連線');
    poll();
  });
  window.addEventListener('offline', function () {
    setOnline(false, '離線（播放快取）');
  });

  /* ---------- 頁面重新可見時立刻更新 ---------- */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) poll();
  });

  /* ---------- 啟動 ---------- */
  function boot() {
    if (!API.isConfigured()) {
      el.idleTitle.textContent = '尚未設定';
      el.idleDate.textContent = '請編輯 config.js 填入 API_URL';
      setOnline(false, '未設定');
      return;
    }

    // 先讀快取，讓畫面立刻有東西（斷網也不空白）
    if (loadCache()) {
      renderAll(false);
    }

    poll();

    // 每 5 分鐘存一次快取（避免頻繁寫入）
    setInterval(saveCache, 300000);
  }

  boot();

  /* ---------- 註冊 Service Worker（離線快取） ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        console.log('[SW] 已註冊，範圍：', reg.scope);
      }).catch(function (err) {
        console.warn('[SW] 註冊失敗（不影響播放）：', err);
      });
    });
  }
})();
</script>
</body>
</html>
